name: Tam Doksan 7/24 Kesintisiz Paylaşım Zamanlayıcı

on:
  schedule:
    # Türkiye Saati (UTC+3):
    # 10:00 TR -> 07:00 UTC
    # 12:00 TR -> 09:00 UTC
    # 15:00 TR -> 12:00 UTC
    # 17:00 TR -> 14:00 UTC
    # 20:00 TR -> 17:00 UTC
    # 22:00 TR -> 19:00 UTC
    # 00:00 TR -> 21:00 UTC
    - cron: '0 7,9,12,14,17,19,21 * * *'
    # Her 10 dakikada bir Render'ı uyanık tutma pingi
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  post_and_keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Render Sunucusunu Tetikle
        run: |
          HOUR=$(date -u +%H)
          MIN=$(date -u +%M)
          echo "Mevcut UTC Saati: $HOUR:$MIN"
          
          # Eğer hedef paylaşım saatindeysek (07, 09, 12, 14, 17, 19, 21 UTC) gönderi paylaş
          if [ "$MIN" -le 10 ] && [[ "$HOUR" =~ ^(07|09|12|14|17|19|21)$ ]]; then
            echo "⚽️ HEDEF SAATİ GELDİ! Gönderi paylaşımı tetikleniyor..."
            curl -s -m 60 "https://tam90-bot.onrender.com/post-now" || true
          else
            echo "⏱️ Render 7/24 Uyanık Tutma Pingi gönderiliyor..."
            curl -s -m 30 "https://tam90-bot.onrender.com/" || true
          fi
